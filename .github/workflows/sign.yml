name: Sign IPA (Apple ID)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "IPA 直链（留空用本仓库最新未签名包）"
        required: false
        default: ""
      bundle_id:
        description: "Bundle ID"
        required: true
        default: "com.rpoq.jitlauncher"
      team_id:
        description: "Team ID（留空用账号默认团队）"
        required: false
        default: ""
      device_udid:
        description: "要加入描述文件的设备 UDID（留空则用账号里已注册的设备）"
        required: false
        default: ""

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_DISABLE_COLORS: "1"
      SPACESHIP_2FA_SMS_DEFAULT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          test -n "$APPLE_ID" || { echo "::error::缺少 APPLE_ID secret"; exit 1; }
          test -n "$APPLE_PASSWORD" || { echo "::error::缺少 APPLE_PASSWORD secret"; exit 1; }
          echo "账号已配置：$APPLE_ID"

      - name: Prepare & fetch IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p work out materials signed
          if [ -n "$IPA_URL" ]; then
            curl -fL "$IPA_URL" -o work/app.ipa
          else
            RUN_ID=$(gh run list --workflow=build.yml --status=success --limit=1 --json databaseId -q '.[0].databaseId')
            echo "使用构建 run $RUN_ID"
            gh run download "$RUN_ID" -n JITRPOQ-unsigned -D work/down
            cp work/down/*.ipa work/app.ipa
          fi
          unzip -q work/app.ipa -d work/extract
          ls -R work/extract | head -20

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Login, create certificate and profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          TEAM: ${{ inputs.team_id != '' && inputs.team_id || secrets.TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          TEAM_ARG=""
          if [ -n "${TEAM:-}" ]; then TEAM_ARG="--team_id $TEAM"; fi
          UDID="${{ inputs.device_udid }}"
          if [ -n "$UDID" ]; then
            echo "== 注册设备 $UDID =="
            fastlane register_device --username "$APPLE_ID" $TEAM_ARG \
              --udid "$UDID" --device_name "iPad" || true
          fi
          echo "== 申请开发证书 =="
          fastlane cert --username "$APPLE_ID" $TEAM_ARG --development true \
            --output_path out --keychain_name build.keychain || true
          echo "== 申请描述文件 =="
          fastlane sigh --username "$APPLE_ID" $TEAM_ARG \
            --app_identifier "$BUNDLE_ID" --development true \
            --output_path out --force true
          ls -lh out || true

      - name: Prepare keychain & identity
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          security list-keychains -d user
          # fastlane cert 默认会把证书装进登录钥匙串；找不到就用导出的 p12
          identity=$(security find-identity -v -p codesigning 2>/dev/null | grep -m1 "Apple Development" | sed -E 's/.*"(.+)"/\1/' || true)
          if [ -z "$identity" ]; then
            P12=$(ls out/*.p12 2>/dev/null | head -1 || true)
            if [ -z "$P12" ]; then echo "::error::没有可用签名证书"; exit 1; fi
            security import "$P12" -k "$HOME/Library/Keychains/login.keychain-db" \
              -P "${CERT_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security || true
            identity=$(security find-identity -v -p codesigning | grep -m1 "Apple Development" | sed -E 's/.*"(.+)"/\1/')
          fi
          echo "IDENTITY=$identity"
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Embed profile, entitlements and codesign
        run: |
          set -euo pipefail
          APP=$(find work/extract/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          test -d "$APP" || { echo "::error::IPA 里没有 .app"; exit 1; }

          PROFILE=$(ls out/*.mobileprovision | head -1)
          cp "$PROFILE" "$APP/embedded.mobileprovision"

          security cms -D -i "$PROFILE" -o work/profile.plist
          plutil -extract Entitlements xml1 -o work/entitlements.plist work/profile.plist

          # 先从里到外签嵌套组件
          find "$APP" -type d \( -name "*.appex" -o -name "*.framework" \) -print0 |
            while IFS= read -r -d '' item; do
              codesign --force --timestamp=none --sign "$IDENTITY" "$item" 2>&1 || true
            done
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 |
            while IFS= read -r -d '' item; do
              codesign --force --timestamp=none --sign "$IDENTITY" "$item" 2>&1 || true
            done

          # 主二进制带 entitlements
          codesign --force --timestamp=none --sign "$IDENTITY" \
            --entitlements work/entitlements.plist "$APP"

          echo "== 验证 =="
          codesign --verify --deep --strict --verbose=2 "$APP" || true
          codesign -d --entitlements :- "$APP" | head -40 || true

      - name: Repackage IPA
        run: |
          set -euo pipefail
          rm -rf work/repack && mkdir -p work/repack/Payload
          APP=$(find work/extract/Payload -maxdepth 1 -name "*.app" | head -1)
          cp -R "$APP" work/repack/Payload/
          cd work/repack
          zip -qry ../signed.ipa Payload
          cd -
          ls -lh work/signed.ipa
          unzip -l work/signed.ipa | head -10

      - name: Export signing materials
        run: |
          set -euo pipefail
          cp out/*.mobileprovision materials/ 2>/dev/null || true
          cp out/*.p12 materials/ 2>/dev/null || true
          if [ -z "$(ls -A materials)" ]; then
            # 从钥匙串导出 p12
            security export -k "$HOME/Library/Keychains/login.keychain-db" -t identities \
              -f pkcs12 -P "${CERT_PASSWORD:-}" -o materials/apple-id-cert.p12 2>/dev/null || true
          fi
          ls -lh materials || true

      - uses: actions/upload-artifact@v4
        with:
          name: JITRPOQ-signed
          path: work/signed.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: signing-materials
          path: materials/
          if-no-files-found: warn
