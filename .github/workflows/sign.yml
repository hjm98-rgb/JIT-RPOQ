name: Sign IPA (Apple ID)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "IPA 直链（留空则使用本仓库最新构建的未签名 IPA）"
        required: false
        default: ""
      bundle_id:
        description: "要签的 Bundle ID"
        required: true
        default: "com.rpoq.jitlauncher"
      team_id:
        description: "Team ID（留空自动取账号默认团队）"
        required: false
        default: ""
      export_p12:
        description: "同时导出 p12 证书与描述文件"
        type: boolean
        default: true

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p work out
          echo "准备 IPA"

      - name: Fetch IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          if [ -n "$IPA_URL" ]; then
            curl -L "$IPA_URL" -o work/app.ipa
          else
            RUN_ID=$(gh run list --workflow=build.yml --status=success --limit=1 --json databaseId -q '.[0].databaseId')
            echo "使用构建 run $RUN_ID"
            gh run download "$RUN_ID" -n JITRPOQ-unsigned -D work/artifact
            cp work/artifact/*.ipa work/app.ipa
          fi
          ls -lh work/app.ipa

      - name: Install fastlane
        run: |
          gem install fastlane --no-document

      - name: Login and fetch certificate + profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          TEAM_ID: ${{ inputs.team_id != '' && inputs.team_id || secrets.TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "缺少 APPLE_ID secret"; exit 1
          fi
          TEAM_ARG=""
          if [ -n "$TEAM_ID" ]; then TEAM_ARG="--team_id $TEAM_ID"; fi
          fastlane cert --username "$APPLE_ID" $TEAM_ARG --output_path out --development true
          fastlane sigh --username "$APPLE_ID" $TEAM_ARG --app_identifier "$BUNDLE_ID" --development true --output_path out --force true
          ls -lh out

      - name: Import certificate into keychain
        run: |
          P12=$(ls out/*.p12 | head -1)
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$P12" -k build.keychain -P "${{ secrets.CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Codesign IPA
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -e
          cd work
          rm -rf payload && mkdir payload && unzip -q app.ipa -d payload
          APP=$(ls -d payload/Payload/*.app | head -1)
          echo "APP=$APP"
          PROFILE=$(ls ../out/*.mobileprovision | head -1)
          cp "$PROFILE" "$APP/embedded.mobileprovision"

          # 从描述文件提取 entitlements
          security cms -D -i "$PROFILE" -o profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > entitlements.plist

          IDENTITY=$(security find-identity -v -p codesigning build.keychain | head -1 | sed -E 's/.*"(.+)"/\1/')
          echo "IDENTITY=$IDENTITY"

          # 先签所有 framework / dylib / appex
          find "$APP" \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) -print0 | while IFS= read -r -d '' item; do
            if [ -d "$item" ]; then
              codesign --force --timestamp=none --sign "$IDENTITY" "$item" || true
            else
              codesign --force --timestamp=none --sign "$IDENTITY" "$item" || true
            fi
          done
          # 主二进制带 entitlements
          codesign --force --timestamp=none --sign "$IDENTITY" --entitlements entitlements.plist "$APP"
          codesign --verify --deep --strict "$APP" || true

          rm -rf payload/Payload
          mkdir -p payload/Payload
          mv "$(dirname "$APP")"/*.app payload/Payload/ 2>/dev/null || true
          (cd payload && zip -qry ../signed.ipa Payload)
          ls -lh ../signed.ipa

      - name: Collect signing materials
        if: ${{ inputs.export_p12 }}
        run: |
          mkdir -p materials
          cp out/*.p12 materials/ 2>/dev/null || true
          cp out/*.mobileprovision materials/ 2>/dev/null || true
          ls -lh materials

      - uses: actions/upload-artifact@v4
        with:
          name: JITRPOQ-signed
          path: work/signed.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.export_p12 }}
        with:
          name: signing-materials
          path: materials/
          if-no-files-found: warn
