name: Build JIT RPOQ

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project JITRPOQ.xcodeproj \
            -target JITRPOQ \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=$(pwd)/build \
            OBJROOT=$(pwd)/build/obj \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build -name "JITRPOQ.app" -type d | head -1)
          echo "APP: $APP_PATH"
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -r -y JITRPOQ-unsigned.ipa Payload
          ls -lh JITRPOQ-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JITRPOQ-unsigned-ipa
          path: out/JITRPOQ-unsigned.ipa

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' project.yml | head -1)
          BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION: "\(.*\)".*/\1/p' project.yml | head -1)
          TAG="v${VERSION}"
          ASSET="JITRPOQ-${VERSION}-unsigned.ipa"
          cp out/JITRPOQ-unsigned.ipa "out/${ASSET}"
          echo "Publishing ${TAG} (build ${BUILD})"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "out/${ASSET}" --clobber
          else
            gh release create "${TAG}" "out/${ASSET}" \
              --title "JIT RPOQ ${TAG}" \
              --generate-notes
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/Logs
          if-no-files-found: ignore
