name: sign-ota

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cert 或 appleid"
        required: true
        default: "cert"
      bundle_id:
        description: "Bundle ID"
        required: true
        default: "com.rpoq.jitlauncher"
      version:
        description: "版本号"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  actions: read

jobs:
  sign:
    runs-on: macos-15
    steps:
      - name: 下载最新的未签名 IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=1" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workflow_runs'][0]['id'])")
          echo "build run: $RUN_ID"
          ART_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['artifacts'][0]['id'])")
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" -o unsigned.zip
          unzip -o -q unsigned.zip
          ls -lh *.ipa

      - name: 解包并准备签名材料
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          MODE: ${{ inputs.mode }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -e
          mkdir -p work
          cd work
          unzip -q ../JITRPOQ-unsigned.ipa
          cd ..

          if [ -z "$P12_BASE64" ]; then
            echo "::error::缺少 P12_BASE64，先在 App 里导入 p12"
            exit 1
          fi
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12

          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain > /dev/null
          security list-keychains -d user -s build.keychain

          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -Eo '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::p12 里没有可用的代码签名证书，检查密码是否正确"
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> $GITHUB_ENV

          if [ -n "$PROFILE_BASE64" ]; then
            echo "$PROFILE_BASE64" | base64 --decode > work/Payload/JITRPOQ.app/embedded.mobileprovision
          elif [ "$MODE" = "appleid" ]; then
            echo "Apple ID 证书模式下没有描述文件，尝试用 fastlane 申请一个"
            gem install fastlane --no-document
            cd work
            fastlane sigh -a "$APPLE_ID" -p "$APPLE_PASSWORD" -b "$BUNDLE_ID" -o .. || true
            cd ..
            PROFILE=$(ls -t *.mobileprovision 2>/dev/null | head -1 || true)
            if [ -n "$PROFILE" ]; then
              cp "$PROFILE" work/Payload/JITRPOQ.app/embedded.mobileprovision
            else
              echo "::error::描述文件申请失败：Apple ID 需要 FASTLANE_SESSION 或已开启双重认证会话，也可直接导入 mobileprovision"
              exit 1
            fi
          else
            echo "::error::证书签名模式需要 mobileprovision 描述文件"
            exit 1
          fi

          security cms -D -i work/Payload/JITRPOQ.app/embedded.mobileprovision > profile.plist
          plutil -extract Entitlements xml1 -o entitlements.plist profile.plist || true
          if [ ! -f entitlements.plist ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>get-task-allow</key><true/></dict></plist>\n' > entitlements.plist
          fi

          codesign --force --deep --sign "$IDENTITY" --entitlements entitlements.plist --timestamp=none work/Payload/JITRPOQ.app
          codesign -vv work/Payload/JITRPOQ.app

      - name: 打包并生成安装清单
        run: |
          set -e
          cd work
          zip -qr ../JITRPOQ-signed.ipa Payload
          cd ..

          VERSION="${{ inputs.version }}"
          IPA_URL="https://github.com/${{ github.repository }}/releases/download/ota/JITRPOQ-signed.ipa"
          cat > manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${IPA_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>${{ inputs.bundle_id }}</string>
                  <key>bundle-version</key>
                  <string>${VERSION}</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>JIT RPOQ</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

      - name: 上传到 ota Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view ota --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create ota --repo ${{ github.repository }} --title "OTA 签名包" --notes "签名后的安装包与无线安装清单"
          gh release upload ota JITRPOQ-signed.ipa manifest.plist --repo ${{ github.repository }} --clobber
